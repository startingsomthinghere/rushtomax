<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RushtoMax - Home</title>
    <!-- Standalone style layer delivery from Cloudflare -->
    <link href="https://cloudflare.com" rel="stylesheet">
    <link href="https://googleapis.com" rel="stylesheet">
    <!-- Clean Cloudflare connection string for Supabase JS Client library -->
    <script src="https://cloudflare.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #1A1C23; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; margin: 0; }
        .clash-font { font-family: 'Luckiest Guy', cursive; letter-spacing: 1px; }
        .game-card { background-color: #242834; border: 1px solid #1f2937; border-radius: 1rem; padding: 2.5rem; max-width: 28rem; width: 100%; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); text-align: center; margin: auto; }
        .game-header { background-color: #242834; border-bottom: 1px solid #1f2937; padding: 1.25rem 1.5rem; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); }
        .google-btn { width: 100%; background-color: #ffffff; color: #111827; font-size: 0.875rem; font-weight: 700; padding: 0.875rem 1.5rem; border-radius: 0.75rem; display: flex; align-items: center; justify-content: center; gap: 0.75rem; cursor: pointer; border: none; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); transition: background-color 0.2s; }
        .google-btn:hover { background-color: #f3f4f6; }
    </style>
</head>
<body class="text-gray-100">

    <header class="game-header">
        <h1 class="clash-font text-yellow-500 text-3xl">⚡ RUSHTOMAX</h1>
    </header>

    <main class="flex-grow flex items-center justify-center p-6 w-full max-w-xl mx-auto">
        <div class="game-card">
            <h2 class="clash-font text-4xl text-white mb-2" style="color: #ffffff !important;">CHIEF LOGIN</h2>
            <p class="clash-font text-xs mb-8 uppercase font-bold tracking-wider" style="color: #F1B82D !important;">Deploy Your Mathematical Blueprint</p>

            <div class="pt-2">
                <button onclick="loginWithGoogle()" class="google-btn">
                    <svg class="w-5 h-5 flex-shrink-0" viewBox="0 0 24 24" width="20" height="20">
                        <path fill="#EA4335" d="M12 5.04c1.62 0 3.08.56 4.22 1.65l3.15-3.15C17.45 1.68 14.93 1 12 1 7.35 1 3.39 3.65 1.41 7.53l3.69 2.86C6.01 7.53 8.78 5.04 12 5.04z"/>
                        <path fill="#4285F4" d="M23.49 12.27c0-.81-.07-1.59-.2-2.34H12v4.44h6.44c-.28 1.46-1.1 2.7-2.34 3.53l3.65 2.83c2.13-1.97 3.37-4.87 3.37-8.46z"/>
                        <path fill="#FBBC05" d="M5.1 14.67c-.24-.72-.38-1.49-.38-2.29s.14-1.57.38-2.29L1.41 7.53C.51 9.29 0 11.23 0 13.29s.51 4 1.41 5.76l3.69-2.38z"/>
                        <path fill="#34A853" d="M12 23c3.24 0 5.97-1.07 7.96-2.91l-3.65-2.83c-1.01.68-2.31 1.08-3.91 1.08-3.22 0-5.99-2.49-6.9-5.36L1.41 15.35C3.39 19.23 7.35 23 12 23z"/>
                    </svg>
                    <span>Continue with Google</span>
                </button>
            </div>
        </div>
    </main>

    <footer class="text-center py-5 border-t border-gray-800 text-[11px] text-gray-500 bg-gray-900">
        Independent community tracking program. Not endorsed by Supercell.
    </footer>

    <script>
        const SUPABASE_URL = "https://supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_dWNfZGZwYnVqdm9xcGpqdW55dW1yazo2YmEyYTRiOS00ZmEyLTRkYTEtOTg5MS02MDZlODQ3YWY3MzA";
        
        // This clean library mapping ensures absolute zero naming collisions
        const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

        async function loginWithGoogle() {
            console.log("Initializing Google Connection Handshake...");
            
            if (!supabaseClient) {
                alert("Error: Supabase library failed to initialize cleanly from the network.");
                return;
            }

            const { data, error } = await supabaseClient.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: window.location.origin + '/strategy.html'
                }
            });
            
            if (error) {
                alert("Auth configuration error: " + error.message);
            }
        }
    </script>
</body>
</html>
