<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RushtoMax - Home</title>
    <script src="https://tailwindcss.com"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .clash-font { font-family: 'Luckiest Guy', cursive; letter-spacing: 1px; }
        .game-btn {
            box-shadow: 0 4px 0 #b87d04;
            transition: all 0.1s ease;
        }
        .game-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 #b87d04;
        }
    </style>
</head>
<body class="bg-[#1A1C23] text-gray-100 min-h-screen flex flex-col justify-between">

    <header class="bg-[#242834] border-b border-gray-800 px-6 py-4 flex justify-between items-center shadow-lg">
        <h1 class="clash-font text-[#F1B82D] text-2xl tracking-wider">⚡ RUSHTOMAX</h1>
    </header>

    <main class="flex-grow flex items-center justify-center p-6">
        <div class="max-w-md w-full bg-[#242834] border border-gray-800 rounded-xl p-8 text-center shadow-2xl">
            <h2 class="clash-font text-3xl text-white mb-2 tracking-wide">CHIEF LOGIN</h2>
            <p class="text-gray-400 text-xs mb-8 uppercase font-semibold tracking-wider">Deploy Your Mathematical Blueprint</p>

            <div class="space-y-4">
                <button onclick="loginWithGoogle()" class="w-full bg-white hover:bg-gray-100 text-gray-900 text-xs font-bold py-3 px-4 rounded-lg flex items-center justify-center gap-2 transition-colors shadow-lg font-semibold">
                    <svg class="w-4 h-4" viewBox="0 0 24 24">
                        <path fill="#EA4335" d="M12 5.04c1.62 0 3.08.56 4.22 1.65l3.15-3.15C17.45 1.68 14.93 1 12 1 7.35 1 3.39 3.65 1.41 7.53l3.69 2.86C6.01 7.53 8.78 5.04 12 5.04z"/>
                        <path fill="#4285F4" d="M23.49 12.27c0-.81-.07-1.59-.2-2.34H12v4.44h6.44c-.28 1.46-1.1 2.7-2.34 3.53l3.65 2.83c2.13-1.97 3.37-4.87 3.37-8.46z"/>
                        <path fill="#FBBC05" d="M5.1 14.67c-.24-.72-.38-1.49-.38-2.29s.14-1.57.38-2.29L1.41 7.53C.51 9.29 0 11.23 0 13.29s.51 4 1.41 5.76l3.69-2.38z"/>
                        <path fill="#34A853" d="M12 23c3.24 0 5.97-1.07 7.96-2.91l-3.65-2.83c-1.01.68-2.31 1.08-3.91 1.08-3.22 0-5.99-2.49-6.9-5.36L1.41 15.35C3.39 19.23 7.35 23 12 23z"/>
                    </svg>
                    Continue with Google
                </button>
            </div>
        </div>
    </main>

    <footer class="text-center py-4 border-t border-gray-800 text-[10px] text-gray-600">
        Independent community tracking program. Not endorsed by Supercell.
    </footer>

    <script>
        // Temporary placeholder credentials. We link these to your Vercel system in our upcoming steps!
        const SUPABASE_URL = "https://supabase.co";
        const SUPABASE_ANON_KEY = "PLACEHOLDER_KEY";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loginWithGoogle() {
            const { data, error } = await supabase.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: window.location.origin + '/strategy.html'
                }
            });
            if (error) alert("Auth error: " + error.message);
        }
    </script>
</body>
</html>
