<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RushtoMax - Home</title>
    <link href="https://cloudflare.com" rel="stylesheet">
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #1A1C23; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; margin: 0; }
        .clash-font { font-family: 'Luckiest Guy', cursive; letter-spacing: 1px; }
        .tile-card { background-color: #242834; border: 2px solid #1f2937; border-radius: 1.5rem; padding: 2rem; width: 100%; transition: all 0.2s ease; text-align: left; cursor: pointer; }
        .tile-card:hover { border-color: #F1B82D; transform: translateY(-4px); box-shadow: 0 10px 20px rgba(241, 184, 45, 0.05); }
    </style>
</head>
<body class="text-gray-100">
    <header class="bg-[#242834] border-b border-gray-800 px-6 py-4 flex justify-between items-center shadow-lg">
        <h1 class="clash-font text-[#F1B82D] text-2xl tracking-wider">⚡ RUSHTOMAX</h1>
    </header>
    <main class="flex-grow flex items-center justify-center p-4 md:p-8">
        <div class="max-w-4xl w-full text-center">
            <h2 class="clash-font text-3xl md:text-4xl text-white mb-2">CHOOSE YOUR STRATEGIC PATH</h2>
            <p class="text-gray-400 text-sm max-w-lg mx-auto mb-10">No login required. Choose an objective below to initialize your mathematical optimization blueprint right away.</p>
            <div class="grid md:grid-cols-2 gap-8 text-left max-w-3xl mx-auto">
                <button onclick="selectPath('rush')" class="tile-card">
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-2xl">🚀</span><span class="text-[10px] bg-amber-900/40 text-amber-400 px-2 py-0.5 rounded border border-amber-800 font-bold uppercase">Speed Path</span>
                    </div>
                    <h3 class="clash-font text-xl text-white mb-2">I WANT TO RUSH</h3>
                    <p class="text-xs text-gray-400 leading-relaxed">Skip low-priority defenses entirely. Focus strictly on Town Hall gates, resource capacity levels, and offensive units to storm to the highest tier.</p>
                </button>
                <button onclick="selectPath('max')" class="tile-card">
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-2xl">🛡️</span><span class="text-[10px] bg-red-900/40 text-red-400 px-2 py-0.5 rounded border border-red-800 font-bold uppercase">Recovery Path</span>
                    </div>
                    <h3 class="clash-font text-xl text-white mb-2">I WANT TO MAX</h3>
                    <p class="text-xs text-gray-400 leading-relaxed">Recover an already messy rushed base. The calculation matrix evaluates your layout constraints to stabilize your core units system.</p>
                </button>
            </div>
        </div>
    </main>
    <footer class="text-center py-4 border-t border-gray-800 text-[10px] text-gray-600">RushtoMax Tool • Permanent Free Static Deployment</footer>
    <script>
        function selectPath(choice) {
            localStorage.setItem("selected_strategy", choice);
            window.location.href = "/intake.html";
        }
    </script>
</body>
</html>
