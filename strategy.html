<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RushtoMax - Choose Strategy</title>
    <script src="https://tailwindcss.com"></script>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .clash-font { font-family: 'Luckiest Guy', cursive; letter-spacing: 1px; }
        .tile-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .tile-card:hover {
            transform: translateY(-4px);
            border-color: #F1B82D;
            box-shadow: 0 10px 20px rgba(241, 184, 45, 0.1);
        }
    </style>
</head>
<body class="bg-[#1A1C23] text-gray-100 min-h-screen flex flex-col justify-between">

    <!-- Header Bar -->
    <header class="bg-[#242834] border-b border-gray-800 px-6 py-4 flex justify-between items-center shadow-lg">
        <h1 class="clash-font text-[#F1B82D] text-2xl tracking-wider">⚡ RUSHTOMAX</h1>
        <span class="text-xs bg-gray-700 px-3 py-1 rounded-full text-gray-300 font-semibold">Step 1: Choose Path</span>
    </header>

    <!-- Main Strategic Container -->
    <main class="flex-grow flex items-center justify-center p-4 md:p-8">
        <div class="max-w-4xl w-full text-center">
            
            <h2 class="clash-font text-3xl md:text-4xl text-white mb-2">CHOOSE YOUR STRATEGIC BLUEPRINT</h2>
            <p class="text-gray-400 text-sm max-w-lg mx-auto mb-10">
                Select your current approach. Our optimization engine changes its mathematical layout based on your objective.
            </p>

            <!-- The Two Massive Tiles Grid -->
            <div class="grid md:grid-cols-2 gap-8 text-left max-w-3xl mx-auto">
                
                <!-- TILE 1: I WANT TO RUSH -->
                <button onclick="selectPath('rush')" class="tile-card w-full block bg-[#242834] border-2 border-gray-800 rounded-2xl p-6 text-left focus:outline-none">
                    <div class="flex justify-between items-start mb-4">
                        <div class="bg-amber-500/10 p-3 rounded-xl border border-amber-500/20 text-2xl">🚀</div>
                        <span class="text-[10px] bg-amber-900/40 text-amber-400 px-2 py-0.5 rounded border border-amber-800 font-bold uppercase tracking-wider">Speed Path</span>
                    </div>
                    <h3 class="clash-font text-xl text-white mb-2 tracking-wide">I WANT TO RUSH</h3>
                    <p class="text-xs text-gray-400 leading-relaxed">
                        Start a brand new account or optimization rush. Skip low-priority defenses entirely to storm straight to the maximum Town Hall level as fast as mathematically possible.
                    </p>
                </button>

                <!-- TILE 2: I WANT TO MAX -->
                <button onclick="selectPath('max')" class="tile-card w-full block bg-[#242834] border-2 border-gray-800 rounded-2xl p-6 text-left focus:outline-none">
                    <div class="flex justify-between items-start mb-4">
                        <div class="bg-red-500/10 p-3 rounded-xl border border-red-500/20 text-2xl">🛡️</div>
                        <span class="text-[10px] bg-red-900/40 text-red-400 px-2 py-0.5 rounded border border-red-800 font-bold uppercase tracking-wider">Recovery Path</span>
                    </div>
                    <h3 class="clash-font text-xl text-white mb-2 tracking-wide">I WANT TO MAX</h3>
                    <p class="text-xs text-gray-400 leading-relaxed">
                        I already rushed my account in the past, and now my base is weak. Deploy the recovery engine to systematically stabilize my structures and catch up my upgrades.
                    </p>
                </button>

            </div>
        </div>
    </main>

    <!-- Footer Information -->
    <footer class="text-center py-4 border-t border-gray-800 text-[10px] text-gray-600">
        This platform utilizes mathematical equations to calculate time efficiency models.
    </footer>

    <script>
        function selectPath(choice) {
            // Saves the user's explicit strategic choice into local storage for the next screen to read
            localStorage.setItem("selected_strategy", choice);
            // Moves forward directly to the base data input/import screen
            window.location.href = "/intake.html";
        }
    </script>
</body>
</html>
